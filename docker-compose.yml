version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: dokatel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dokatel_root
      MYSQL_DATABASE: dokatel
      MYSQL_USER: dokatel
      MYSQL_PASSWORD: dokatel_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: dokatel-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql

  qdrant:
    image: qdrant/qdrant:latest
    container_name: dokatel-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mysql_data:
  qdrant_data: